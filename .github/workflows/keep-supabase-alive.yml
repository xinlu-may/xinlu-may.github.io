# 保持資料庫運作：Supabase 免費專案一週沒人使用會被自動暫停，
# 這個排程每週一、週四各呼叫一次資料庫（只讀取 1 筆題目編號，不寫入任何資料）。
name: 保持資料庫運作

on:
  schedule:
    - cron: '17 1 * * 1,4'   # 台灣時間每週一、週四 09:17
  workflow_dispatch:          # 也可以在 GitHub 的 Actions 頁面手動執行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫資料庫
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            "https://iqxzsflawxzvniycmaub.supabase.co/rest/v1/assessment_questions?select=id&limit=1" \
            -H "apikey: sb_publishable_vjWW-hsmNdYqjjqPmiWo2w_YQ4X6kP4"
